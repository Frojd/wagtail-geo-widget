name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*", "testv*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        wagtail-version: ["7.4", "8.0", "8.1"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
          - python-version: "3.10"
            wagtail-version: "8.1"
          - wagtail-version: "7.4"
            django-version: "6.1"
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          set -xe
          sudo apt-get update
          sudo apt-get install gdal-bin libgdal-dev
          python -m pip install --upgrade pip
          pip install .[test]
          pip install psycopg2-binary>=2.9.3
      - name: Install wagtail ${{ matrix.wagtail-version }} and django ${{ matrix.django-version }}
        run: pip install "wagtail~=${{ matrix.wagtail-version }}.0" "django~=${{ matrix.django-version }}.0"
      - name: Run tests
        run: |
          pytest
        env:
          DATABASE_NAME: postgres
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          GOOGLE_MAPS_V3_APIKEY: X

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black==22.3.0 isort
      - name: Check formatting with black
        run: black --check --verbose .
      - name: Check import order with isort
        run: isort . --check-only

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  security-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install zizmor
        run: pip install zizmor==1.32.0
      - name: Audit GitHub Actions workflows
        run: zizmor --config zizmor.yml --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: [test, lint, security, security-actions]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/testv')
    uses: $/.github/workflows/deploy.yml
    secrets:
      TEST_PYPI_PASSWORD: ${{ secrets.TEST_PYPI_PASSWORD }}
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
